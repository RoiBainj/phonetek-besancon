<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Phonetek – Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f7fc;--card:#fff;--tx:#0a0f1a;--mut:#566074;--bd:#dbe3ef;--ac:#1a63ff;--red:#c4281c;--ok:#1d7a45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Segoe UI",sans-serif}
h1,h2{font-family:"Barlow Condensed",Impact,sans-serif;font-style:italic;text-transform:uppercase;margin:0 0 10px}
h1{font-size:28px}h2{font-size:22px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 16px;min-height:42px;background:var(--ac);color:#fff}
button.ghost{background:#fff;color:var(--tx);border:1px solid var(--bd)}
button.danger{background:var(--red)}
button.sm{padding:6px 12px;min-height:34px;font-size:14px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx)}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.login{max-width:360px;margin:12vh auto;padding:0 16px;display:grid;gap:12px}
.err{color:var(--red);font-size:14px;min-height:1em}
header{background:#0a0f1a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font:italic 800 22px "Barlow Condensed",sans-serif;text-transform:uppercase}
main{max-width:1000px;margin:0 auto;padding:0 14px 60px}
nav{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
nav button{background:#fff;color:var(--tx);border:1px solid var(--bd)}
nav button[aria-current="true"]{background:var(--ac);color:#fff;border-color:var(--ac)}
.badge{background:var(--red);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{background:#fff;color:var(--tx);border:2px solid var(--bd);border-radius:8px;padding:8px 14px}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.step{font-weight:700;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.bar input{flex:1;min-width:160px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item.off{opacity:.6}
.item small{color:var(--mut)}
.price{width:110px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:#dcf3e5;color:var(--ok)}
.pill.off{background:#fbe3e1;color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.stat b{display:block;font:800 28px "Barlow Condensed",sans-serif}.stat span{color:var(--mut);font-size:13px}
.wx{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}
th{color:var(--mut);background:#f8fafd}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0a0f1a;color:#fff;padding:12px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>

<section id="loginView" class="login hidden">
  <h1>Phonetek – Admin</h1>
  <form id="loginForm" class="card" style="display:grid;gap:12px">
    <label>Email<input id="email" type="email" required autocomplete="username"></label>
    <label>Mot de passe<input id="password" type="password" required autocomplete="current-password"></label>
    <button type="submit">Se connecter</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<div id="appView" class="hidden">
<header><b>Phonetek · Admin</b><button class="ghost sm" id="logout">Déconnexion</button></header>
<main>
<nav>
  <button data-tab="phones" aria-current="true">Téléphones</button>
  <button data-tab="requests" aria-current="false">Demandes<span class="badge hidden" id="newBadge"></span></button>
  <button data-tab="stats" aria-current="false">Statistiques</button>
</nav>

<section id="tab-phones">
  <div class="card" id="qaCard">
    <h2>Ajouter un téléphone</h2>
    <div id="qa"></div>
    <button class="ghost sm" id="freeBtn">Autre modèle (saisie libre)</button>
  </div>

  <div id="phoneForm" class="card hidden">
    <h2 id="pfTitle">Nouveau téléphone</h2>
    <form id="pf" style="display:grid;gap:12px">
      <input type="hidden" id="pId">
      <div class="grid2">
        <label>Marque<input id="pBrand" required></label>
        <label>Modèle<input id="pName" required></label>
        <label>Stockage<input id="pStorage" placeholder="128 Go"></label>
        <label>État<input id="pState" placeholder="Très bon état"></label>
        <label>Prix indicatif (€)<input id="pPrice" type="number" min="0"></label>
        <label>Lien de la photo (facultatif)<input id="pPhoto" type="url" placeholder="https://..."></label>
      </div>
      <label>Caractéristiques (une par ligne : Nom: valeur)<textarea id="pSpecs" rows="4"></textarea></label>
      <label class="row" style="color:var(--tx)"><input id="pVisible" type="checkbox" checked style="width:auto"> Visible sur le site</label>
      <div class="row"><button type="submit">Enregistrer</button><button type="button" class="ghost" id="pCancel">Annuler</button></div>
      <div class="err" id="pErr"></div>
    </form>
  </div>

  <div class="bar"><input id="search" type="search" placeholder="Rechercher un téléphone…" aria-label="Rechercher"></div>
  <div id="list"></div>
</section>

<section id="tab-requests" class="hidden">
  <h2>Demandes des clients</h2>
  <div class="wx"><table><thead><tr><th>Date</th><th>Téléphone</th><th>Client</th><th>Message</th><th>Statut</th></tr></thead><tbody id="reqBody"></tbody></table></div>
</section>

<section id="tab-stats" class="hidden">
  <div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Statistiques</h2>
    <select id="period" style="width:auto"><option value="7">7 derniers jours</option><option value="30" selected>30 derniers jours</option><option value="0">Tout</option></select></div>
  <div class="stats" id="totals"></div>
  <div class="wx"><table><thead><tr><th>Modèle</th><th>Vues</th><th>Appels</th><th>Demandes</th><th>Taux</th></tr></thead><tbody id="statBody"></tbody></table></div>
</section>
</main>
</div>
<div id="toast" role="status"></div>

<script>
var SUPABASE_URL = "https://arjhvfbfmlfmzhspyfuw.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyamh2ZmJmbWxmbXpoc3B5ZnV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3MzUyMTYsImV4cCI6MjEwOTMxMTIxNn0.0vefoq_icJ6CnGihMhPtXnO5Hk9H29CTmjt_CtoL1OU";
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== Catalogue de modèles : p = prix indicatif du 1er stockage "comme neuf", step = supplément par stockage =====
var STATES = [["Comme neuf",1],["Très bon état",.92],["Bon état",.82],["Correct",.7]];
var BC = {Apple:"#1f2a44",Samsung:"#4b3a6e",Xiaomi:"#8a5a1f",Google:"#3d7a4a"};
function S(e,b,c,g){return {"Écran":e,"Batterie":b,"Appareil photo":c,"Garantie":g||"6 mois"};}
var MODELS = [
 {b:"Apple",n:"iPhone 11",st:["64 Go","128 Go"],p:249,step:30,s:S('6,1" LCD','Santé 85 %',"12 Mpx double")},
 {b:"Apple",n:"iPhone 12",st:["64 Go","128 Go","256 Go"],p:309,step:40,s:S('6,1" OLED','Santé 86 %',"12 Mpx double")},
 {b:"Apple",n:"iPhone 13",st:["128 Go","256 Go","512 Go"],p:419,step:50,s:S('6,1" OLED','Santé 88 %',"12 Mpx double")},
 {b:"Apple",n:"iPhone 14",st:["128 Go","256 Go"],p:529,step:60,s:S('6,1" OLED','Santé 90 %',"12 Mpx double")},
 {b:"Apple",n:"iPhone 15",st:["128 Go","256 Go"],p:669,step:70,s:S('6,1" OLED 60 Hz',"Santé 93 %","48 Mpx double")},
 {b:"Apple",n:"iPhone 15 Pro",st:["128 Go","256 Go","512 Go"],p:849,step:90,s:S('6,1" OLED 120 Hz',"Santé 93 %","48 Mpx triple")},
 {b:"Samsung",n:"Galaxy S22",st:["128 Go","256 Go"],p:339,step:40,s:S('6,1" AMOLED 120 Hz',"3700 mAh","50 Mpx triple")},
 {b:"Samsung",n:"Galaxy S23",st:["128 Go","256 Go"],p:459,step:50,s:S('6,1" AMOLED 120 Hz',"3900 mAh","50 Mpx triple")},
 {b:"Samsung",n:"Galaxy S24",st:["128 Go","256 Go"],p:629,step:60,s:S('6,2" AMOLED 120 Hz',"4000 mAh","50 Mpx triple")},
 {b:"Samsung",n:"Galaxy A54",st:["128 Go","256 Go"],p:249,step:30,s:S('6,4" AMOLED 120 Hz',"5000 mAh","50 Mpx triple")},
 {b:"Samsung",n:"Galaxy A35",st:["128 Go","256 Go"],p:279,step:30,s:S('6,6" AMOLED 120 Hz',"5000 mAh","50 Mpx triple")},
 {b:"Xiaomi",n:"Redmi Note 12",st:["128 Go","256 Go"],p:169,step:25,s:S('6,67" AMOLED 120 Hz',"5000 mAh","50 Mpx triple")},
 {b:"Xiaomi",n:"Redmi Note 13",st:["128 Go","256 Go"],p:199,step:25,s:S('6,67" AMOLED 120 Hz',"5000 mAh","108 Mpx triple")},
 {b:"Xiaomi",n:"Xiaomi 13T",st:["256 Go"],p:339,step:0,s:S('6,67" AMOLED 144 Hz',"5000 mAh","50 Mpx triple")},
 {b:"Google",n:"Pixel 7",st:["128 Go","256 Go"],p:299,step:40,s:S('6,3" OLED 90 Hz',"4355 mAh","50 Mpx double")},
 {b:"Google",n:"Pixel 8",st:["128 Go","256 Go"],p:429,step:50,s:S('6,2" OLED 120 Hz',"4575 mAh","50 Mpx double")}
];
var STARTER = [3,2,7,9,11,14,5,1]; // index des modèles ajoutés par « modèles de départ »

var phones=[], requests=[], views=[], q="", qa={b:null,m:null,st:null,si:1,price:""};
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function eur(n){return n==null?"—":Number(n).toLocaleString("fr-FR")+" €";}
function dt(d){return new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"});}
function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on");},2200);}
function suggest(m,st,si){var i=m.st.indexOf(st);return Math.round((m.p+i*m.step)*STATES[si][1]/5)*5;}

// ===== Connexion =====
$("#loginForm").addEventListener("submit",async function(e){
 e.preventDefault();$("#loginErr").textContent="";
 var r=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});
 if(r.error){$("#loginErr").textContent="Email ou mot de passe incorrect.";return;}
 showApp();
});
$("#logout").addEventListener("click",async function(){await sb.auth.signOut();location.reload();});
async function init(){var s=await sb.auth.getSession();if(s.data.session)showApp();else $("#loginView").classList.remove("hidden");}
function showApp(){$("#loginView").classList.add("hidden");$("#appView").classList.remove("hidden");renderQA();loadAll();}

document.querySelectorAll("nav [data-tab]").forEach(function(b){b.addEventListener("click",function(){
 document.querySelectorAll("nav [data-tab]").forEach(function(x){x.setAttribute("aria-current",x===b?"true":"false");});
 ["phones","requests","stats"].forEach(function(t){$("#tab-"+t).classList.toggle("hidden",t!==b.dataset.tab);});
});});

async function loadAll(){
 phones=(await sb.from("phones").select("*").order("created_at",{ascending:false})).data||[];
 requests=(await sb.from("requests").select("*").order("created_at",{ascending:false})).data||[];
 views=(await sb.from("views").select("phone_id,kind,created_at")).data||[];
 renderList();renderRequests();renderStats();
}

// ===== Ajout rapide =====
function chips(items,sel,key){return '<div class="chips">'+items.map(function(x,i){return '<button class="chip" data-'+key+'="'+i+'" aria-pressed="'+(sel===i)+'">'+esc(x)+'</button>';}).join("")+'</div>';}
function renderQA(){
 var brands=[];MODELS.forEach(function(m){if(brands.indexOf(m.b)<0)brands.push(m.b);});
 var h='<div class="step">1. Marque</div>'+chips(brands,brands.indexOf(qa.b),"b");
 if(qa.b){
  var ms=MODELS.filter(function(m){return m.b===qa.b;});
  h+='<div class="step">2. Modèle</div><div class="chips">'+ms.map(function(m){var i=MODELS.indexOf(m);return '<button class="chip" data-m="'+i+'" aria-pressed="'+(qa.m===i)+'">'+esc(m.n)+'</button>';}).join("")+'</div>';
 }
 if(qa.m!=null){
  var m=MODELS[qa.m];
  h+='<div class="step">3. Stockage</div>'+chips(m.st,m.st.indexOf(qa.st),"st");
  h+='<div class="step">4. État</div>'+chips(STATES.map(function(x){return x[0];}),qa.si,"si");
  h+='<div class="step">5. Prix indicatif (modifiable)</div><div class="row" style="margin-bottom:14px"><input id="qaPrice" type="number" min="0" class="price" value="'+qa.price+'"> <span>€</span></div>';
  h+='<button id="qaAdd">Ajouter à la vitrine</button> ';
 }
 $("#qa").innerHTML=h;
}
$("#qa").addEventListener("click",async function(e){
 var c=e.target.closest("[data-b],[data-m],[data-st],[data-si],#qaAdd");if(!c)return;
 if(c.dataset.b!=null){qa={b:["Apple","Samsung","Xiaomi","Google"].filter(function(b){return MODELS.some(function(m){return m.b===b;});})[+c.dataset.b],m:null,st:null,si:1,price:""};}
 else if(c.dataset.m!=null){qa.m=+c.dataset.m;qa.st=MODELS[qa.m].st[0];qa.si=1;qa.price=suggest(MODELS[qa.m],qa.st,qa.si);}
 else if(c.dataset.st!=null){qa.st=MODELS[qa.m].st[+c.dataset.st];qa.price=suggest(MODELS[qa.m],qa.st,qa.si);}
 else if(c.dataset.si!=null){qa.si=+c.dataset.si;qa.price=suggest(MODELS[qa.m],qa.st,qa.si);}
 else if(c.id==="qaAdd"){
  var m=MODELS[qa.m],p=$("#qaPrice").value;
  c.disabled=true;
  var r=await sb.from("phones").insert({brand:m.b,name:m.n,storage:qa.st,state:STATES[qa.si][0],price:p===""?null:parseInt(p,10),color:BC[m.b]||"#1a63ff",specs:m.s,visible:true});
  if(r.error){toast("Erreur : "+r.error.message);c.disabled=false;return;}
  toast(m.n+" "+qa.st+" ajouté");qa.m=null;qa.st=null;qa.price="";await loadAll();
 }
 renderQA();
});
$("#qa").addEventListener("input",function(e){if(e.target.id==="qaPrice")qa.price=e.target.value;});

// ===== Liste =====
$("#search").addEventListener("input",function(){q=this.value.toLowerCase();renderList();});
function renderList(){
 var items=phones.filter(function(p){return (p.brand+" "+p.name+" "+(p.storage||"")).toLowerCase().indexOf(q)>=0;});
 if(!phones.length){
  $("#list").innerHTML='<div class="card">Aucun téléphone pour le moment.<br><br><button id="starter">Ajouter 8 modèles de départ</button></div>';return;
 }
 $("#list").innerHTML=items.map(function(p){
  return '<div class="item'+(p.visible?'':' off')+'"><div><b>'+esc(p.brand)+' '+esc(p.name)+'</b> <span class="pill'+(p.visible?'':' off')+'">'+(p.visible?'Visible':'Masqué')+'</span><br><small>'+esc(p.storage)+' · '+esc(p.state)+'</small></div>'+
  '<div class="row"><input class="price" type="number" min="0" value="'+(p.price==null?'':p.price)+'" data-price="'+p.id+'" aria-label="Prix"> €'+
  '<button class="ghost sm" data-act="toggle" data-id="'+p.id+'">'+(p.visible?'Masquer':'Afficher')+'</button>'+
  '<button class="ghost sm" data-act="edit" data-id="'+p.id+'">Modifier</button>'+
  '<button class="danger sm" data-act="del" data-id="'+p.id+'">Supprimer</button></div></div>';
 }).join("")||'<div class="card">Aucun résultat.</div>';
}
$("#list").addEventListener("click",async function(e){
 if(e.target.id==="starter"){
  var rows=STARTER.map(function(i){var m=MODELS[i];return {brand:m.b,name:m.n,storage:m.st[0],state:STATES[1][0],price:suggest(m,m.st[0],1),color:BC[m.b],specs:m.s,visible:true};});
  var r=await sb.from("phones").insert(rows);if(r.error){toast("Erreur : "+r.error.message);return;}
  toast("Modèles de départ ajoutés");loadAll();return;
 }
 var b=e.target.closest("[data-act]");if(!b)return;
 var id=b.dataset.id,p=phones.filter(function(x){return String(x.id)===id;})[0];if(!p)return;
 if(b.dataset.act==="edit")openForm(p);
 if(b.dataset.act==="toggle"){await sb.from("phones").update({visible:!p.visible}).eq("id",id);toast(p.visible?"Masqué":"Affiché");loadAll();}
 if(b.dataset.act==="del"){if(!confirm("Supprimer « "+p.brand+" "+p.name+" » ? Vous pouvez aussi le masquer."))return;await sb.from("phones").delete().eq("id",id);toast("Supprimé");loadAll();}
});
$("#list").addEventListener("change",async function(e){
 var i=e.target.closest("[data-price]");if(!i)return;
 var r=await sb.from("phones").update({price:i.value===""?null:parseInt(i.value,10)}).eq("id",i.dataset.price);
 toast(r.error?"Erreur : "+r.error.message:"Prix mis à jour");
});

// ===== Saisie libre / modification =====
$("#freeBtn").addEventListener("click",function(){openForm(null);});
$("#pCancel").addEventListener("click",function(){$("#phoneForm").classList.add("hidden");});
function openForm(p){
 $("#pErr").textContent="";$("#pfTitle").textContent=p?"Modifier le téléphone":"Nouveau téléphone";
 $("#pId").value=p?p.id:"";$("#pBrand").value=p?p.brand:"";$("#pName").value=p?p.name:"";
 $("#pStorage").value=p?(p.storage||""):"";$("#pState").value=p?(p.state||""):"";
 $("#pPrice").value=p&&p.price!=null?p.price:"";$("#pPhoto").value=p?(p.photo_url||""):"";
 $("#pVisible").checked=p?p.visible:true;
 $("#pSpecs").value=p&&p.specs?Object.keys(p.specs).map(function(k){return k+": "+p.specs[k];}).join("\n"):"";
 $("#phoneForm").classList.remove("hidden");$("#phoneForm").scrollIntoView({behavior:"smooth"});$("#pBrand").focus();
}
function parseSpecs(t){var o={};t.split("\n").forEach(function(l){var i=l.indexOf(":");if(i>0){var k=l.slice(0,i).trim();if(k)o[k]=l.slice(i+1).trim();}});return o;}
$("#pf").addEventListener("submit",async function(e){
 e.preventDefault();
 var pv=$("#pPrice").value,brand=$("#pBrand").value.trim();
 var d={brand:brand,name:$("#pName").value.trim(),storage:$("#pStorage").value.trim()||null,state:$("#pState").value.trim()||null,
  price:pv===""?null:parseInt(pv,10),color:BC[brand]||"#1a63ff",photo_url:$("#pPhoto").value.trim()||null,specs:parseSpecs($("#pSpecs").value),visible:$("#pVisible").checked};
 var id=$("#pId").value;
 var r=id?await sb.from("phones").update(d).eq("id",id):await sb.from("phones").insert(d);
 if(r.error){$("#pErr").textContent="Erreur : "+r.error.message;return;}
 $("#phoneForm").classList.add("hidden");toast("Enregistré");loadAll();
});

// ===== Demandes =====
var STATUTS=["nouveau","en cours","traité","fermé"];
function renderRequests(){
 var by={};phones.forEach(function(p){by[p.id]=p;});
 var n=requests.filter(function(r){return r.status==="nouveau";}).length;
 $("#newBadge").textContent=n;$("#newBadge").classList.toggle("hidden",!n);
 $("#reqBody").innerHTML=requests.map(function(r){
  var p=by[r.phone_id],c=String(r.contact||""),isTel=/^[+\d][\d\s.]{7,}$/.test(c);
  return '<tr><td>'+dt(r.created_at)+'</td><td>'+esc(p?p.brand+" "+p.name:"(supprimé)")+'</td><td><b>'+esc(r.name)+'</b><br>'+(isTel?'<a href="tel:'+esc(c.replace(/\s/g,""))+'">'+esc(c)+'</a>':esc(c))+'</td><td style="max-width:300px">'+esc(r.message)+'</td>'+
  '<td><select data-req="'+r.id+'" style="width:auto">'+STATUTS.map(function(s){return '<option'+(s===r.status?' selected':'')+'>'+s+'</option>';}).join("")+'</select></td></tr>';
 }).join("")||'<tr><td colspan="5">Aucune demande pour le moment.</td></tr>';
}
$("#reqBody").addEventListener("change",async function(e){
 var s=e.target.closest("[data-req]");if(!s)return;
 await sb.from("requests").update({status:s.value}).eq("id",s.dataset.req);
 var r=requests.filter(function(x){return String(x.id)===s.dataset.req;})[0];if(r)r.status=s.value;renderRequests();
});

// ===== Statistiques =====
$("#period").addEventListener("change",renderStats);
function renderStats(){
 var days=parseInt($("#period").value,10),since=days?Date.now()-days*86400000:0;
 var inP=function(d){return new Date(d).getTime()>=since;};
 var rows=phones.map(function(p){
  var v=views.filter(function(x){return x.phone_id===p.id&&x.kind==="vue"&&inP(x.created_at);}).length;
  var c=views.filter(function(x){return x.phone_id===p.id&&x.kind==="appel"&&inP(x.created_at);}).length;
  var r=requests.filter(function(x){return x.phone_id===p.id&&inP(x.created_at);}).length;
  return {p:p,v:v,c:c,r:r,t:v?Math.round(r/v*100):null};
 }).sort(function(a,b){return b.v-a.v;});
 var sum=function(k){return rows.reduce(function(s,r){return s+r[k];},0);};
 $("#totals").innerHTML='<div class="stat"><b>'+sum("v")+'</b><span>Consultations</span></div><div class="stat"><b>'+sum("c")+'</b><span>Clics « Appeler »</span></div><div class="stat"><b>'+sum("r")+'</b><span>Demandes</span></div>';
 $("#statBody").innerHTML=rows.map(function(r){return '<tr><td><b>'+esc(r.p.brand)+'</b> '+esc(r.p.name)+' <small>'+esc(r.p.storage)+'</small></td><td>'+r.v+'</td><td>'+r.c+'</td><td>'+r.r+'</td><td>'+(r.t==null?'—':r.t+' %')+'</td></tr>';}).join("")||'<tr><td colspan="5">Aucun téléphone.</td></tr>';
}
init();
</script>
</body>
</html>
