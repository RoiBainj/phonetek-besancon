<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Phonetek – Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f7fc;--card:#fff;--tx:#0a0f1a;--mut:#566074;--bd:#dbe3ef;--ac:#1a63ff;--red:#c4281c;--ok:#1d7a45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
h1,h2{font-family:"Barlow Condensed",Impact,sans-serif;font-style:italic;text-transform:uppercase;margin:0 0 12px}
h1{font-size:28px}h2{font-size:22px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:6px;padding:9px 14px;background:var(--ac);color:#fff}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.danger{background:var(--red)}
button.small{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:var(--tx)}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px}
.login{max-width:360px;margin:12vh auto;display:grid;gap:12px}
.err{color:var(--red);font-size:14px;min-height:1em}
header{background:#0a0f1a;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-family:"Barlow Condensed",sans-serif;font-style:italic;font-size:22px;text-transform:uppercase}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
nav button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
nav button[aria-current="true"]{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:1100px;margin:0 auto;padding:0 16px 40px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}
th{color:var(--mut);font-weight:600;background:#f8fafd}
.wrapx{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bd);color:var(--mut)}
.pill.off{background:#fbe3e1;color:var(--red)}
.pill.on{background:#dcf3e5;color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.stat b{display:block;font-size:26px;font-family:"Barlow Condensed",sans-serif}
.stat span{color:var(--mut);font-size:13px}
.hidden{display:none !important}
</style>
</head>
<body>

<!-- Connexion -->
<section id="loginView" class="login hidden">
  <h1>Phonetek – Admin</h1>
  <form id="loginForm" class="card" style="display:grid;gap:12px">
    <label>Email<input id="email" type="email" required autocomplete="username"></label>
    <label>Mot de passe<input id="password" type="password" required autocomplete="current-password"></label>
    <button type="submit">Se connecter</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<!-- Application -->
<div id="appView" class="hidden">
  <header>
    <b>Phonetek · Admin</b>
    <button class="ghost small" id="logout" style="color:#fff;border-color:#fff">Se déconnecter</button>
  </header>
  <main>
    <nav>
      <button data-tab="phones" aria-current="true">Téléphones</button>
      <button data-tab="requests" aria-current="false">Demandes</button>
      <button data-tab="stats" aria-current="false">Statistiques</button>
    </nav>

    <!-- Téléphones -->
    <section id="tab-phones">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h2 style="margin:0">Téléphones en vitrine</h2>
        <button id="newPhone">+ Ajouter un téléphone</button>
      </div>
      <div class="wrapx"><table>
        <thead><tr><th>Modèle</th><th>Stockage</th><th>État</th><th>Prix</th><th>Statut</th><th></th></tr></thead>
        <tbody id="phonesBody"></tbody>
      </table></div>

      <div id="phoneForm" class="card hidden" style="margin-top:16px">
        <h2 id="phoneFormTitle">Nouveau téléphone</h2>
        <form id="phoneFormEl" style="display:grid;gap:12px">
          <input type="hidden" id="pId">
          <div class="grid2">
            <label>Marque<input id="pBrand" required></label>
            <label>Modèle<input id="pName" required></label>
            <label>Stockage<input id="pStorage" placeholder="128 Go"></label>
            <label>État<input id="pState" placeholder="Très bon état"></label>
            <label>Prix indicatif (€)<input id="pPrice" type="number" min="0"></label>
            <label>Couleur de la fiche<input id="pColor" type="color" value="#1a63ff"></label>
          </div>
          <label>Photo (lien d'image)<input id="pPhoto" type="url" placeholder="https://..."></label>
          <label>Caractéristiques (une par ligne, format « Nom: valeur »)
            <textarea id="pSpecs" rows="5" placeholder="Écran: 6,1&quot; OLED&#10;Batterie: 91 %"></textarea>
          </label>
          <label class="row" style="color:var(--tx)"><input id="pVisible" type="checkbox" checked style="width:auto"> Visible sur le site</label>
          <div class="row">
            <button type="submit">Enregistrer</button>
            <button type="button" class="ghost" id="cancelPhone">Annuler</button>
          </div>
          <div class="err" id="phoneErr"></div>
        </form>
      </div>
    </section>

    <!-- Demandes -->
    <section id="tab-requests" class="hidden">
      <h2>Demandes des clients</h2>
      <div class="wrapx"><table>
        <thead><tr><th>Date</th><th>Téléphone</th><th>Client</th><th>Message</th><th>Statut</th></tr></thead>
        <tbody id="reqBody"></tbody>
      </table></div>
    </section>

    <!-- Statistiques -->
    <section id="tab-stats" class="hidden">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h2 style="margin:0">Statistiques</h2>
        <select id="period" style="width:auto">
          <option value="7">7 derniers jours</option>
          <option value="30" selected>30 derniers jours</option>
          <option value="0">Tout</option>
        </select>
      </div>
      <div class="stats" id="totals"></div>
      <div class="wrapx"><table>
        <thead><tr><th>Modèle</th><th>Vues</th><th>Appels</th><th>Demandes</th><th>Taux de demande</th></tr></thead>
        <tbody id="statBody"></tbody>
      </table></div>
    </section>
  </main>
</div>

<script>
// ===== Configuration (clé publique anon, sans risque dans le navigateur) =====
var SUPABASE_URL = "https://arjhvfbfmlfmzhspyfuw.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyamh2ZmJmbWxmbXpoc3B5ZnV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3MzUyMTYsImV4cCI6MjEwOTMxMTIxNn0.0vefoq_icJ6CnGihMhPtXnO5Hk9H29CTmjt_CtoL1OU";

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var phones = [], requests = [], views = [];
var $ = function(s){return document.querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function eur(n){return n==null?"—":Number(n).toLocaleString("fr-FR")+" €";}
function fmtDate(d){return new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"});}

// ===== Connexion =====
$("#loginForm").addEventListener("submit", async function(e){
  e.preventDefault();
  $("#loginErr").textContent = "";
  var r = await sb.auth.signInWithPassword({email:$("#email").value.trim(), password:$("#password").value});
  if (r.error) { $("#loginErr").textContent = "Email ou mot de passe incorrect."; return; }
  showApp();
});
$("#logout").addEventListener("click", async function(){ await sb.auth.signOut(); location.reload(); });

async function init(){
  var s = await sb.auth.getSession();
  if (s.data.session) showApp(); else $("#loginView").classList.remove("hidden");
}
function showApp(){
  $("#loginView").classList.add("hidden");
  $("#appView").classList.remove("hidden");
  loadAll();
}

// ===== Navigation =====
document.querySelectorAll("nav [data-tab]").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll("nav [data-tab]").forEach(function(x){x.setAttribute("aria-current", x===b?"true":"false");});
    ["phones","requests","stats"].forEach(function(t){ $("#tab-"+t).classList.toggle("hidden", t!==b.dataset.tab); });
  });
});

// ===== Chargement =====
async function loadAll(){
  var p = await sb.from("phones").select("*").order("created_at",{ascending:false});
  phones = p.data || [];
  var r = await sb.from("requests").select("*").order("created_at",{ascending:false});
  requests = r.data || [];
  var v = await sb.from("views").select("phone_id,kind,created_at");
  views = v.data || [];
  renderPhones(); renderRequests(); renderStats();
}

// ===== Téléphones =====
function renderPhones(){
  $("#phonesBody").innerHTML = phones.map(function(p){
    return '<tr>'+
      '<td><b>'+esc(p.brand)+'</b> '+esc(p.name)+'</td>'+
      '<td>'+esc(p.storage)+'</td><td>'+esc(p.state)+'</td><td>'+eur(p.price)+'</td>'+
      '<td><span class="pill '+(p.visible?'on':'off')+'">'+(p.visible?'Visible':'Masqué')+'</span></td>'+
      '<td class="row">'+
        '<button class="ghost small" data-act="edit" data-id="'+p.id+'">Modifier</button>'+
        '<button class="ghost small" data-act="toggle" data-id="'+p.id+'">'+(p.visible?'Masquer':'Afficher')+'</button>'+
        '<button class="danger small" data-act="del" data-id="'+p.id+'">Supprimer</button>'+
      '</td></tr>';
  }).join("") || '<tr><td colspan="6">Aucun téléphone pour le moment.</td></tr>';
}

$("#newPhone").addEventListener("click", function(){ openForm(null); });
$("#cancelPhone").addEventListener("click", function(){ $("#phoneForm").classList.add("hidden"); });

function openForm(p){
  $("#phoneErr").textContent = "";
  $("#phoneFormTitle").textContent = p ? "Modifier le téléphone" : "Nouveau téléphone";
  $("#pId").value = p ? p.id : "";
  $("#pBrand").value = p ? p.brand : "";
  $("#pName").value = p ? p.name : "";
  $("#pStorage").value = p ? (p.storage||"") : "";
  $("#pState").value = p ? (p.state||"") : "";
  $("#pPrice").value = p && p.price!=null ? p.price : "";
  $("#pColor").value = p ? (p.color||"#1a63ff") : "#1a63ff";
  $("#pPhoto").value = p ? (p.photo_url||"") : "";
  $("#pVisible").checked = p ? p.visible : true;
  $("#pSpecs").value = p && p.specs ? Object.keys(p.specs).map(function(k){return k+": "+p.specs[k];}).join("\n") : "";
  $("#phoneForm").classList.remove("hidden");
  $("#pBrand").focus();
  $("#phoneForm").scrollIntoView({behavior:"smooth"});
}

function parseSpecs(text){
  var out = {};
  text.split("\n").forEach(function(line){
    var i = line.indexOf(":");
    if (i > 0) { var k = line.slice(0,i).trim(), v = line.slice(i+1).trim(); if (k) out[k] = v; }
  });
  return out;
}

$("#phoneFormEl").addEventListener("submit", async function(e){
  e.preventDefault();
  var priceVal = $("#pPrice").value;
  var data = {
    brand: $("#pBrand").value.trim(),
    name: $("#pName").value.trim(),
    storage: $("#pStorage").value.trim() || null,
    state: $("#pState").value.trim() || null,
    price: priceVal === "" ? null : parseInt(priceVal, 10),
    color: $("#pColor").value,
    photo_url: $("#pPhoto").value.trim() || null,
    specs: parseSpecs($("#pSpecs").value),
    visible: $("#pVisible").checked
  };
  var id = $("#pId").value;
  var res = id ? await sb.from("phones").update(data).eq("id", id)
               : await sb.from("phones").insert(data);
  if (res.error) { $("#phoneErr").textContent = "Erreur : " + res.error.message; return; }
  $("#phoneForm").classList.add("hidden");
  loadAll();
});

$("#phonesBody").addEventListener("click", async function(e){
  var b = e.target.closest("[data-act]"); if (!b) return;
  var id = b.dataset.id, p = phones.filter(function(x){return String(x.id)===id;})[0];
  if (!p) return;
  if (b.dataset.act === "edit") openForm(p);
  if (b.dataset.act === "toggle") { await sb.from("phones").update({visible:!p.visible}).eq("id", id); loadAll(); }
  if (b.dataset.act === "del") {
    if (!confirm("Supprimer définitivement « " + p.brand + " " + p.name + " » ? Conseil : masquez-le plutôt.")) return;
    await sb.from("phones").delete().eq("id", id); loadAll();
  }
});

// ===== Demandes =====
var STATUTS = ["nouveau","en cours","traité","fermé"];
function renderRequests(){
  var byId = {}; phones.forEach(function(p){ byId[p.id] = p; });
  $("#reqBody").innerHTML = requests.map(function(r){
    var p = byId[r.phone_id];
    var name = p ? p.brand+" "+p.name : "(téléphone supprimé)";
    return '<tr><td>'+fmtDate(r.created_at)+'</td><td>'+esc(name)+'</td>'+
      '<td><b>'+esc(r.name)+'</b><br>'+esc(r.contact)+'</td>'+
      '<td style="max-width:320px">'+esc(r.message)+'</td>'+
      '<td><select data-req="'+r.id+'" style="width:auto">'+
        STATUTS.map(function(s){return '<option'+(s===r.status?' selected':'')+'>'+s+'</option>';}).join("")+
      '</select></td></tr>';
  }).join("") || '<tr><td colspan="5">Aucune demande pour le moment.</td></tr>';
}
$("#reqBody").addEventListener("change", async function(e){
  var s = e.target.closest("[data-req]"); if (!s) return;
  await sb.from("requests").update({status:s.value}).eq("id", s.dataset.req);
});

// ===== Statistiques =====
$("#period").addEventListener("change", renderStats);
function renderStats(){
  var days = parseInt($("#period").value, 10);
  var since = days ? Date.now() - days*86400000 : 0;
  var inPeriod = function(d){ return new Date(d).getTime() >= since; };

  var rows = phones.map(function(p){
    var pv = views.filter(function(v){ return v.phone_id===p.id && v.kind==="vue" && inPeriod(v.created_at); }).length;
    var pc = views.filter(function(v){ return v.phone_id===p.id && v.kind==="appel" && inPeriod(v.created_at); }).length;
    var pr = requests.filter(function(r){ return r.phone_id===p.id && inPeriod(r.created_at); }).length;
    return {p:p, vues:pv, appels:pc, demandes:pr, taux: pv ? Math.round(pr/pv*100) : null};
  }).sort(function(a,b){ return b.vues - a.vues; });

  var tv = rows.reduce(function(s,r){return s+r.vues;},0);
  var ta = rows.reduce(function(s,r){return s+r.appels;},0);
  var td = requests.filter(function(r){return inPeriod(r.created_at);}).length;
  $("#totals").innerHTML =
    '<div class="stat"><b>'+tv+'</b><span>Consultations de fiches</span></div>'+
    '<div class="stat"><b>'+ta+'</b><span>Clics sur « Appeler »</span></div>'+
    '<div class="stat"><b>'+td+'</b><span>Demandes d’intérêt</span></div>';

  $("#statBody").innerHTML = rows.map(function(r){
    return '<tr><td><b>'+esc(r.p.brand)+'</b> '+esc(r.p.name)+(r.p.visible?'':' <span class="pill off">masqué</span>')+'</td>'+
      '<td>'+r.vues+'</td><td>'+r.appels+'</td><td>'+r.demandes+'</td>'+
      '<td>'+(r.taux==null?'—':r.taux+' %')+'</td></tr>';
  }).join("") || '<tr><td colspan="5">Aucun téléphone.</td></tr>';
}

init();
</script>
</body>
</html>
